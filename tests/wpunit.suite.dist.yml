class_name: WpunitTester
modules:
    enabled:
        - \Helper\Wpunit
        - WPQueries
        - WPLoader:
            wpRootFolder: "%WP_ROOT_FOLDER%"
            dbName: "%TEST_DB_NAME%"
            dbHost: "%TEST_DB_HOST%"
            dbUser: "%TEST_DB_USER%"
            dbPassword: "%TEST_DB_PASSWORD%"
            domain: "%WP_DOMAIN%"
            adminEmail: "admin@%WP_DOMAIN%"
            title: 'Coupon Creator Tests'
            plugins:
                - coupon-creator/coupon_creator.php
            activatePlugins:
                - coupon-creator/coupon_creator.php
